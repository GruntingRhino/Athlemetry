global:
  resolve_timeout: 5m

route:
  receiver: athlemetry-operator
  group_by:
    - alertname
    - severity
  group_wait: 5s
  group_interval: 30s
  repeat_interval: 4h
  routes:
    - receiver: athlemetry-operator
      matchers:
        - severity="critical"
      repeat_interval: 30m

receivers:
  - name: athlemetry-operator
    webhook_configs:
      - url_file: /run/secrets/alertmanager_webhook_url
        send_resolved: true
        max_alerts: 20
        timeout: 10s
