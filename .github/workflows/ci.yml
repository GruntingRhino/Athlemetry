name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The synthetic-media regression test probes generated clips with ffprobe.
      # Install the CLI explicitly; ubuntu-latest does not guarantee it.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run lint
      - run: npm test
      # NextAuth validates its secret while statically prerendering pages. CI
      # does not need a database or an authentication secret, so use
      # build-only placeholders rather than production credentials.
      - run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/athlemetry?schema=public
          DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/athlemetry?schema=public
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ci-only-build-secret-not-for-runtime
      - run: npx playwright install --with-deps chromium
      - run: npm run test:a11y
      - run: docker build --target web -t athlemetry-web:ci .
      - run: docker build --target worker -t athlemetry-worker:ci .
