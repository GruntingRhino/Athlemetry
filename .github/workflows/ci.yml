name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # The synthetic-media regression test probes generated clips with ffprobe.
      # Install the CLI explicitly; ubuntu-latest does not guarantee it.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:a11y
      - run: docker build --target web -t athlemetry-web:ci .
      - run: docker build --target worker -t athlemetry-worker:ci .
